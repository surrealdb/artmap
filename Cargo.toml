[package]
name = "artmap"
publish = true
version = "0.7.0"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
readme = "CARGO.md"
description = "A concurrent in-memory Adaptive Radix Tree (ART) featuring optimistic lock coupling."
repository = "https://github.com/surrealdb/artmap"
documentation = "https://docs.rs/artmap"
keywords = [
    "art",
    "radix-tree",
    "trie",
    "concurrent",
    "mvcc",
]
categories = ["data-structures", "concurrency", "database-implementations"]

[dependencies]
byteslice = "0.2"
crossbeam-epoch = "0.9"

[dev-dependencies]
rand = "0.8.5"
criterion = "0.5.1"
divan = "0.1.14"
imbl = "7.0"
crossbeam-skiplist = "0.1.3"
arenaskiplist = "0.2.0"
parking_lot = "0.12"
dashmap = "6.1"
papaya = "0.2"
scc = "3.8"
concread = "0.5"
vart = "0.11"
proptest = { version = "1.10", default-features = false, features = ["std"] }

# The library itself imports loom under `cfg(loom)` (§16.3), so it is a normal
# dependency; dev-dependencies are invisible to the lib.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(loom)',
    'cfg(crossbeam_loom)',
    'cfg(artmap_hooks)',
    'cfg(artmap_provenance_lints)',
] }
unsafe_op_in_unsafe_fn = "deny"

[[bench]]
name = "artmap_bench"
harness = false

[[bench]]
name = "comparison_bench"
harness = false

[[bench]]
name = "alloc_comparison"
harness = false

[lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
allow_attributes = "allow"
assigning_clones = "warn"
bool_assert_comparison = "allow"
clone_on_ref_ptr = "warn"
cloned_instead_of_copied = "warn"
debug_assert_with_mut_call = "warn"
disallowed_methods = "warn"
expl_impl_clone_on_copy = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
get_unwrap = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
large_types_passed_by_value = "warn"
lossy_float_literal = "warn"
mutex_atomic = "warn"
no_effect_underscore_binding = "warn"
option_as_ref_cloned = "warn"
redundant_clone = "warn"
ref_option_ref = "warn"
set_contains_or_insert = "warn"
single_char_pattern = "warn"
trivially_copy_pass_by_ref = "warn"
unnecessary_to_owned = "warn"
unwrap_used = "allow"
used_underscore_binding = "warn"

[[bench]]
name = "safety_bench"
harness = false

[[bench]]
name = "memory_bench"
harness = false
